name: Update MagicMeteo Data

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # ogni 6 ore
  workflow_dispatch:               # consente run manuale

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: |
          cd static/magicmeteo
          python3 ../../scripts/fetch_meteo_v3.py

      - name: Commit and push new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/magicmeteo/data/
          git diff --staged --quiet || git commit -m "chore: update meteo data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push