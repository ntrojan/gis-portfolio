<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Wolf movements across Switzerland</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Spatial and temporal analysis of wolf observations in Switzerland between 1999 and 2022.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
        <link rel="stylesheet" href="./css/style.css" />
    </head>

    <body>
        <!-- Map (full-screen background) -->
        <div id="map"></div>

        <!-- Left column: title + filters -->
        <div id="left-col">
            <div id="header">
                <h1>Wolves in Switzerland</h1>
                <h2>Spatial and temporal analysis of observations between 1999 and 2022, based on genetic recognition tracking provided by the KORA institute.</h2>
            </div>

            <div id="filters">
                <div class="filters-title">Filters</div>
                <div class="filters-hint">Year, Canton and Wolf ID: tick the boxes to combine values or select a range.</div>

                <div>
                    <label for="filter-gender">Gender</label>
                    <select id="filter-gender" onchange="applyFilters()">
                        <option value="">All</option>
                        <option value="M">Males</option>
                        <option value="F">Females</option>
                    </select>
                </div>

                <div>
                    <label>Year</label>
                    <div class="checkbox-group" id="filter-year"></div>
                </div>

                <div>
                    <label>Canton</label>
                    <div class="checkbox-group" id="filter-canton"></div>
                </div>

                <div>
                    <label>Wolf ID</label>
                    <div class="checkbox-group" id="filter-wolf-id"></div>
                </div>

                <button id="reset-filters" onclick="resetFilters()">Reset filters</button>
            </div>
        </div>

        <!-- Right column: charts -->
        <div id="right-col">
            <div id="year-chart" class="chart"></div>
            <div id="canton-chart" class="chart"></div>
            <div id="scatter-plot" class="chart">
                <div class="tt-legend">
                    <span><i style="background:#f48fb1"></i>Female</span>
                    <span><i style="background:#4fc3f7"></i>Male</span>
                </div>
                <div id="scatter-svg"></div>
                <div id="time-slider-container">
                    <span class="slider-label">Year</span>
                    <input type="range" id="time-slider" min="1999" max="2022" step="1" value="1999" />
                    <label id="year-label">1999</label>
                </div>
            </div>
        </div>

        <!-- Data sources -->
        <div id="data-sources">
            Data sources: <a href="https://www.kora.ch/en" target="_blank">KORA</a> and <a href="https://www.swisstopo.admin.ch/de/landschaftsmodell-swisstlmregio" target="_blank">Swisstopo</a>
        </div>

        <!-- Libraries, scripts and plugins -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
        <script src="./js/polylinedecorator.js"></script>
        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@turf/turf/turf.min.js"></script>
        <script src="js/script.js" defer></script>

    </body>
</html>
